# Test-only workflow for TeeKay87/HENCC-Issue-Test (main).
# No changes to the production HEN-Cheats-Collection repository.
name: HENCC - Issue Snapshot Test

on:
  workflow_dispatch:
  issues:
    types: [opened, closed, reopened, edited, labeled, unlabeled]

# Keep complete snapshots from being deployed out of order as much as possible.
# Back-to-back events still require dedicated concurrency/reconciliation tests.
concurrency:
  group: hencc-issue-snapshot-pages-test
  cancel-in-progress: false

permissions: {}

jobs:
  generate-snapshot:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Label new HENCC reports
        if: github.event.action == 'opened'
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue?.body || '';

            const isHenccReport =
              /<!--\s*HENCC:\s*[A-Z]{4}[0-9]{5}\/[0-9.]+\/source:[a-fA-F0-9]{8}\s*-->/.test(body);

            if (!isHenccReport) {
              core.info('Not a HENCC report. Skipping labeling.');
              return;
            }

            const existingLabels =
              (context.payload.issue.labels || []).map(label => label.name);

            if (existingLabels.includes('bug')) {
              core.info('HENCC report already has the bug label.');
              return;
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['bug']
            });

            core.info('HENCC report labeled successfully.');

      - name: Generate HENCC issue data
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const markerRegex =
              /<!--\s*HENCC:\s*([A-Z]{4}[0-9]{5})\/([0-9.]+)\/source:([a-fA-F0-9]{8})\s*-->/;

            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                labels: 'bug',
                per_page: 100
              }
            );

            // GitHub may take a moment to include newly labeled
            // issues in filtered API results.
            //
            // On an 'opened' event, the previous step has already
            // applied the bug label successfully.
            //
            // Include the issue from the trusted GitHub event
            // payload if it is missing from the API response.

            if (context.payload.action === 'opened') {
              const openedIssue = context.payload.issue;

              if (
                openedIssue &&
                openedIssue.state === 'open' &&
                markerRegex.test(openedIssue.body || '') &&
                !issues.some(issue => issue.number === openedIssue.number)
              ) {
                issues.unshift(openedIssue);

                core.info(
                  `Included newly opened issue #${openedIssue.number} ` +
                  'from the event payload.'
                );
              }
            }

            const groups = new Map();

            for (const issue of issues) {
              if (issue.pull_request) continue;
              if (issue.state !== 'open') continue;

              const body = issue.body || '';
              const marker = body.match(markerRegex);

              if (!marker) continue;

              const fileKey =
                `${marker[1]}/${marker[2]}/source:${marker[3].toLowerCase()}`;

              const section = body
                .split(/^### Which cheat\(s\) have problems\?[ \t]*$/m)[1]
                ?.split(/^### /m)[0] || '';

              const cheats = [...new Set(
                section
                  .split(/\r?\n/)
                  .map(line => line.match(/^\s*-\s+(.+?)\s*$/)?.[1])
                  .filter(Boolean)
              )];

              if (!groups.has(fileKey)) {
                groups.set(fileKey, []);
              }

              groups.get(fileKey).push({
                number: issue.number,
                authorId: issue.user.id,
                author: issue.user.login,
                url: issue.html_url,
                cheats
              });
            }

            const files = {};

            for (const [fileKey, reports] of groups) {
              const uniqueReporters =
                new Set(reports.map(r => r.authorId)).size;

              const reportedCheats = {};

              for (const report of reports) {
                for (const cheat of report.cheats) {
                  if (!reportedCheats[cheat]) {
                    reportedCheats[cheat] = [];
                  }

                  reportedCheats[cheat].push({
                    number: report.number,
                    author: report.author,
                    url: report.url
                  });
                }
              }

              files[fileKey] = {
                openReports: reports.length,
                uniqueReporters,
                issueFlag: uniqueReporters >= 2,
                reportedCheats
              };
            }

            const snapshot = {
              schema: 1,
              generatedUtc: new Date().toISOString(),
              files
            };

            // Only output location changes: make Pages' artifact root explicit.
            fs.mkdirSync('public-issue-status', { recursive: true });
            fs.writeFileSync(
              'public-issue-status/github-issues.json',
              JSON.stringify(snapshot, null, 2) + '\n'
            );
            fs.writeFileSync(
              'public-issue-status/index.html',
              '<!doctype html><html lang="en"><head><meta charset="utf-8"><title>HENCC issue status test</title></head><body><a href="github-issues.json">Issue status JSON</a></body></html>\n'
            );
            fs.writeFileSync('public-issue-status/.nojekyll', '');

            core.info(JSON.stringify(snapshot, null, 2));

      - name: Upload JSON result (debug artifact)
        uses: actions/upload-artifact@v4
        with:
          name: hencc-issue-snapshot-test
          path: public-issue-status/github-issues.json

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public-issue-status

  deploy:
    needs: generate-snapshot
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy issue snapshot to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
